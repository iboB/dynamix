#
# smoke test for the benchmarks: mostly check that they build and run
# timings here are not meaningful (CI machines are noisy) and are not compared to anything
# the cachegrind build is used for regression testing
name: Benchmark Smoke Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset release -B build
      - name: Run Benchmarks
        run: cmake --build build --target smoke-bench-dynamix
