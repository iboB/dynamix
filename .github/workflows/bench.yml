#
# Smoke test for the benchmarks: check that they build and run, and that they produce consistent results.
# The timings here are not meaningful (CI machines are noisy) and are not compared to anything.
# For regression testing, see cachegrind.yml
name: Benchmark Smoke Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset release -B build
      - name: Build multi-threaded benchmarks
        # build only: they're not run, as their results are meaningless with few cores
        run: cmake --build build --target bench-dynamix-threads
      - name: Run single-threaded benchmarks
        # runs each benchmark with few iterations and a single sample
        run: cmake --build build --target smoke-bench-dynamix
